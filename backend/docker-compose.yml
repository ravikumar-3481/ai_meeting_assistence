services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-meeting-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - UVICORN_WORKERS=1
    volumes:
      # Persist meeting audio downloads, outputs, and exports across container restarts
      - meeting_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  meeting_data:
    driver: local
